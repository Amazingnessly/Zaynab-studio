name: Materialize Zaynab Studio source

on:
  push:
    branches:
      - agent/bootstrap-v4
    paths:
      - .github/workflows/materialize-source.yml
      - scripts/materialize-source.sh

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout agent branch
        uses: actions/checkout@v4
        with:
          ref: agent/bootstrap-v4
          fetch-depth: 0

      - name: Materialize source tree from last verified legacy package
        run: bash scripts/materialize-source.sh

      - name: Commit materialized source
        run: |
          if git diff --quiet -- app/; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "zaynab-studio-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/
          git commit -m "chore: materialize app source from verified package"
          git push origin HEAD:agent/bootstrap-v4
