name: Deploy Zaynab Studio staging

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app/**
      - src/**
      - scripts/**
      - migrations/**
      - wrangler.staging.jsonc
      - package.json
      - .github/workflows/deploy-staging.yml

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  STAGING_BASE_URL: https://zaynab-studio-staging.gassamasa.workers.dev

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
      - name: Validate release
        run: node scripts/validate-release.mjs
      - name: Install Wrangler
        run: npm install --no-audit --no-fund
      - name: Apply staging D1 migrations
        run: npm run d1:migrate:staging
      - name: Deploy staging
        run: npx wrangler deploy --config wrangler.staging.jsonc
      - name: Smoke test staging API
        shell: bash
        run: |
          set -euo pipefail
          BASE="$STAGING_BASE_URL/api"
          HEALTH=""
          for attempt in {1..12}; do
            if HEALTH=$(curl -fsS --retry 2 --retry-delay 1 "$BASE/health"); then
              break
            fi
            sleep 2
          done
          test -n "$HEALTH" || { echo "Staging health endpoint did not respond"; exit 1; }
          printf '%s' "$HEALTH" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(!j.ok||!j.persistence_ready||j.real_gpu_allowed!==false||j.mode!=='mock')process.exit(1)})"

          QUOTE=$(curl -fsS "$BASE/v1/render-quote")
          printf '%s' "$QUOTE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(j.real_gpu_allowed!==false||j.approval_required!==true||j.quote_status!=='informational_only'||Number(j.vram_gb)<48||Number(j.max_compute_estimate_eur_with_25pct_buffer)<=0)process.exit(1)})"

          READINESS=$(curl -fsS "$BASE/v1/gpu-readiness")
          printf '%s' "$READINESS" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(j.real_gpu_allowed!==false||j.ready_for_paid_activation!==false||j.human_approval_required!==true)process.exit(1)})"

          REAL_STATUS=$(curl -sS -o /tmp/zaynab-real-probe.json -w '%{http_code}' -X POST "$BASE/v1/real-generate" \
            -H 'content-type: application/json' \
            --data '{"project_id":"ci-smoke","title":"Blocked real smoke","prompt":"Must never reach RunPod.","mode":"Brouillon","format":"9:16","duration":"5 s","approved_max_eur":0.50}')
          test "$REAL_STATUS" = "423" || { cat /tmp/zaynab-real-probe.json; echo "Real GPU route did not fail closed"; exit 1; }

          UPLOAD_STATUS=$(curl -sS -o /tmp/zaynab-upload-probe.json -w '%{http_code}' -X PUT "$BASE/v1/uploads/ci-probe" -H 'content-type: video/mp4' --data-binary '')
          test "$UPLOAD_STATUS" = "401" || { cat /tmp/zaynab-upload-probe.json; echo "Unauthenticated upload route was not rejected"; exit 1; }

          RESPONSE=$(curl -fsS -X POST "$BASE/v1/generate"             -H 'content-type: application/json'             --data '{"project_id":"ci-smoke","title":"CI smoke","prompt":"Short zero-cost staging smoke validation.","mode":"Brouillon","format":"9:16","duration":"5 s"}')
          JOB_ID=$(printf '%s' "$RESPONSE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(j.mode!=='mock'||j.cost_eur!==0||!j.job_id)process.exit(1);process.stdout.write(j.job_id)})")

          sleep 9
          JOB=$(curl -fsS "$BASE/v1/jobs/$JOB_ID")
          printf '%s' "$JOB" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(j.status!=='completed'||j.mode!=='mock'||j.cost_eur!==0||j.progress!==100)process.exit(1)})"
