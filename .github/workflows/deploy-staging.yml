name: Deploy Zaynab Studio staging

on:
  workflow_dispatch:
  push:
    branches: [agent/zaynab-references-v2]
    paths:
      - app/**
      - src/**
      - wrangler.staging.jsonc
      - package.json
      - .github/workflows/deploy-staging.yml

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy-staging:
    if: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.CLOUDFLARE_API_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate release
        run: node scripts/validate-release.mjs
      - name: Install Wrangler
        run: npm install --no-audit --no-fund
      - name: Deploy staging
        run: npx wrangler deploy --config wrangler.staging.jsonc
