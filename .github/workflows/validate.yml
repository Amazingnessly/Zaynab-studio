name: Validate Zaynab Studio

on:
  push:
    branches: [main, agent/zaynab-references-v2]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-release.mjs
