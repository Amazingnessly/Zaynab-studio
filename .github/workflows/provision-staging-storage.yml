name: Provision Zaynab Studio staging storage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/provision-staging-storage.yml

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  provision-storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
      - name: Install Wrangler
        run: npm install --no-audit --no-fund
      - name: Ensure D1 database
        shell: bash
        run: |
          set -euo pipefail
          if npx wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s);process.exit(a.some(x=>x.name==='zaynab-studio')?0:1)})"; then
            echo "D1 zaynab-studio already exists"
          else
            npx wrangler d1 create zaynab-studio
          fi
          echo "D1 inventory:"
          npx wrangler d1 list --json
      - name: Ensure R2 bucket
        shell: bash
        run: |
          set -euo pipefail
          if npx wrangler r2 bucket info zaynab-studio-videos >/dev/null 2>&1; then
            echo "R2 zaynab-studio-videos already exists"
          else
            npx wrangler r2 bucket create zaynab-studio-videos
          fi
          npx wrangler r2 bucket info zaynab-studio-videos --json
